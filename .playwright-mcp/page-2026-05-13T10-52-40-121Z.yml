    - heading "Pakistan has a vibrant social innovation sector. Scale is the next frontier." [level=2] [ref=e32]:
      - text: Pakistan has a vibrant social
      - text: innovation sector. Scale is
      - text: the next frontier.
    - generic [ref=e33]:
      - paragraph [ref=e34]: 240 million people. A learning crisis. A hunger crisis. A mental health system that barely exists. A generation of founders has decided not to wait — and they are building real solutions, with real evidence, at real cost. The missing piece is not ambition or talent. It is the knowledge, capital, and networks to cross from thousands of beneficiaries to millions.
