        - paragraph [ref=e241]: Mulago Foundation has spent over twenty years funding organisations that achieve impact at genuine scale — 77 portfolio organisations, $26M deployed last year, backing nonprofits and for-profits alike. Their Scale Screen framework is the intellectual backbone of this fellowship, and Kevin Starr, Mulago's founder, leads the curriculum in person.
