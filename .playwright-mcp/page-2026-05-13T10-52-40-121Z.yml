    - generic [ref=e208]:
      - generic [ref=e209]: The Setting
      - heading "Skardu Valley, Northern Pakistan" [level=2] [ref=e210]:
        - text: Skardu Valley,
        - text: Northern Pakistan
      - generic [ref=e211]:
        - paragraph [ref=e212]: The valley sits at 2,438 metres above sea level, at the point where the Indus and Shigar rivers meet. It was carved by glaciers over 3.2 million years. The rocks beneath your feet are between 37 and 105 million years old.
        - paragraph [ref=e213]: In June, the surrounding peaks block the monsoon entirely. While the rest of Pakistan swelters, Skardu sits under clear skies at 15–25°C. The air is clean. The silence is extraordinary. There is nowhere else in Pakistan quite like it.
      - generic [ref=e214]:
        - generic [ref=e215]:
          - generic [ref=e216]: The mountains
          - generic [ref=e217]: Four of the world's five highest peaks are within this district — K2, Broad Peak, Gasherbrum I & II. More 8,000m summits than anywhere else on earth.
        - generic [ref=e218]:
          - generic [ref=e219]: The climate
          - generic [ref=e220]: In June, temperatures sit between 15–25°C. The surrounding peaks block the monsoon entirely. While the rest of Pakistan swelters, Skardu is clear skies and cool mountain air.
  - generic [ref=e221]:
    - generic [ref=e222]: Who is behind this
    - heading "Built by people who have done this before." [level=2] [ref=e223]:
      - text: Built by people who have
      - text: done this before.
    - paragraph [ref=e224]: This fellowship is not a new idea from a new organisation. It is a deliberate collaboration between two entities that have spent decades working on exactly this problem — one from inside Pakistan, one from across the world.
