        - paragraph [ref=e233]: "Taleemabad is Pakistan's leading EdTech organisation — reaching over two million children through national TV and an app ranked #1 in Education on the Play Store. The fellowship is Taleemabad's attempt to share what it learned building to scale, and to create a rigorous pathway from proof to national impact for the broader social sector."
