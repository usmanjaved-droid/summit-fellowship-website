        - heading "Venue Information" [level=2] [ref=e439]
        - heading "Khoj Resort, Skardu" [level=3] [ref=e440]
        - paragraph [ref=e441]: The fellowship takes place at Khoj Resort, located in the heart of Skardu. The resort features comfortable rooms, restaurant and dining facilities, meeting halls, outdoor spaces for activities, and reliable WiFi connectivity.
        - paragraph [ref=e442]:
          - strong [ref=e443]: "Address:"
          - text: Khoj Resort, Skardu, Skardu, Gilgit-Baltistan, Pakistan
        - paragraph [ref=e444]:
          - strong [ref=e445]: "Check-in:"
          - text: Afternoon (Day 0)
        - paragraph [ref=e446]:
          - strong [ref=e447]: "Check-out:"
          - text: Morning (Day 7)
        - heading "About the Location" [level=3] [ref=e448]
        - paragraph [ref=e449]: Skardu is a beautiful mountain city situated at 2,226 meters (7,300 feet) above sea level (7 feet) above sea level in the Gilgit-Baltistan region of Pakistan. Known for its stunning natural landscapes, the location provides an ideal setting for an intensive retreat focused on clarity and strategic thinking.
      - generic [ref=e450]:
        - heading "Getting to Skardu" [level=2] [ref=e451]
        - heading "Flight Options" [level=3] [ref=e452]
        - paragraph [ref=e453]: Fly to Islamabad (Benazir Bhutto International Airport - ISD) or Peshawar (Peshawar International Airport - PEW), then connecting flight to Skardu.
        - paragraph [ref=e454]:
          - strong [ref=e455]: "Airlines:"
          - text: "Pakistan International Airlines (PIA), Serene Air. Skardu airport has limited flights. Book early. Flight time from Islamabad to Skardu: ~1.5 hours."
        - heading "Ground Transportation" [level=3] [ref=e456]
        - paragraph [ref=e457]:
          - strong [ref=e458]: "Airport Pickup:"
          - text: Arranged by organizers from Skardu airport
        - paragraph [ref=e459]: The journey from Skardu airport to Khoj Resort takes approximately 30 minutes from airport to Khoj Resort. Fellowship covers transportation to/from airport in Skardu
        - heading "Travel Tips" [level=3] [ref=e460]
        - paragraph [ref=e461]: It's advisable to book your flights well in advance, as Skardu airport has limited daily flights. Ensure your passport is valid for at least 6 months beyond your travel dates. If you require a visa, contact the Pakistani embassy in your country for current requirements and processing times.
