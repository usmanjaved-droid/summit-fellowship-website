        - heading "Activities & Recreation" [level=3] [ref=e517]
        - paragraph [ref=e518]: Beyond the core curriculum, Skardu offers wonderful opportunities for outdoor activities. You'll have time for hiking, sightseeing, and exploring the beautiful mountain landscapes surrounding the resort. The combination of structured learning and outdoor recreation helps refresh your mind and build stronger connections with fellow fellows.
