        - paragraph [ref=e488]: Skardu experiences pleasant summer weather during the fellowship. Temperatures typically range from 15-25°C (59-77°F), with pleasant summer weather, occasional rain.
        - paragraph [ref=e489]: Given the high altitude (2,226 meters (7,300 feet) above sea level), Skardu is in the mountains. Bring layers. Sun protection is important.
